<style>

:root{
--bg:#050505;
--glass:rgba(10,10,12,0.85);
--border:rgba(255,255,255,0.1);
--text:#ffe4ec;
--muted:#ffb6c1;
--accent:#ff8da0;
--accent-glow:rgba(255,141,160,0.6);
--font:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
min-height:100vh;
background:var(--bg);
color:var(--text);
font-family:var(--font);
display:flex;
align-items:center;
justify-content:center;
position:relative;
}

#bg-layer{
position:fixed;
top:-10%;
left:-10%;
width:120%;
height:120%;
background:
linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),
url("https://i.pinimg.com/originals/5c/a5/79/5ca579ef2ba2e2f33618822bf0b08480.gif")
center/cover no-repeat;
z-index:0;
}

#overlay{
position:fixed;
inset:0;
background:#050505;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
color:var(--accent);
letter-spacing:5px;
font-size:14px;
text-transform:uppercase;
z-index:100;
transition:opacity .3s ease;
}

#matrix-canvas{
position:fixed;
inset:0;
opacity:.15;
pointer-events:none;
z-index:1;
}

body::after{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(rgba(18,16,16,0) 50%,rgba(0,0,0,.25) 50%);
background-size:100% 4px;
pointer-events:none;
z-index:10;
}

.terminal{

position:relative;
z-index:20;

width:min(850px,92vw);
max-height:90vh;

background:var(--glass);
border:1px solid var(--border);
border-radius:18px;

backdrop-filter:blur(16px);
-webkit-backdrop-filter:blur(16px);

box-shadow:0 25px 50px rgba(0,0,0,.6);

padding:32px;
overflow:auto;

}

.title{
font-size:20px;
margin-bottom:6px;
}

.subtitle{
font-size:13px;
color:var(--muted);
margin-bottom:24px;
}

.links{
display:flex;
flex-direction:column;
gap:12px;
}

.links a{

display:block;

padding:12px 14px;

border:1px solid var(--border);
border-radius:10px;

color:var(--text);
text-decoration:none;

background:rgba(255,255,255,0.02);

transition:.2s;

}

.links a:hover{
border-color:var(--accent);
box-shadow:0 0 10px var(--accent-glow);
transform:translateY(-1px);
}

footer{
margin-top:24px;
font-size:12px;
color:var(--muted);
opacity:.7;
}

@media (max-width:600px){

.terminal{
padding:22px;
border-radius:14px;
}

.title{
font-size:18px;
}

}

</style>
</head>

<body>

<div id="bg-layer"></div>

<canvas id="matrix-canvas"></canvas>

<div id="overlay">ENTER THE WIRED</div>

<div class="terminal">

<div class="title">
Alvin / Choutenshi
</div>

<div class="subtitle">
connecting to the wired...
</div>

<div class="links">

<a href="#">github</a>
<a href="#">discord</a>
<a href="#">twitter</a>
<a href="#">email</a>

</div>

<footer>
© wired node
</footer>

</div>

</body>
</html>
